name: MaskPad iOS build

# Required ROM-free proof for the sole project repository. Upstream source
# trees are pinned build inputs and this workflow never publishes to them.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository-safety:
    name: Repository safety
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check assets, history, scripts, patches, links, and credentials
        run: scripts/check-repo-safety.sh

  ios-build:
    name: Full app (unsigned iPhoneOS)
    runs-on: macos-15
    timeout-minutes: 120
    needs: repository-safety

    steps:
      - uses: actions/checkout@v7

      - name: Install host archive-build dependencies
        run: >-
          brew install cmake ninja pkgconf sdl2 glew nlohmann-json libpng
          libzip tinyxml2 libogg libvorbis opus opusfile sdl2_net

      - name: Cache host and iOS dependencies
        uses: actions/cache@v6
        with:
          path: |
            build-host/_deps
            build-ios-device/_deps
          key: maskpad-ios-${{ runner.os }}-${{ hashFiles('patches/**', 'port/**', 'scripts/*.sh') }}

      - name: Reconstruct pinned source
        run: |
          scripts/clone-sources.sh
          scripts/apply-patches.sh

      - name: Reproduce unsigned arm64 iPhoneOS app
        run: |
          scripts/configure-ios.sh --device
          scripts/build-ios.sh --device

      - name: Package and audit unsigned IPA
        run: |
          scripts/package-unsigned-ipa.sh
          scripts/verify-release.sh artifacts/MaskPad-0.1.0-unsigned.ipa
